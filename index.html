<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not patch window.fetch directly:", e);
          try {
            var originalFetchProto = Window.prototype.fetch || window.fetch;
            var customFetchProto = originalFetchProto;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return customFetchProto;
              },
              set: function(val) {
                customFetchProto = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err2) {
            console.error("Could not patch Window.prototype.fetch:", err2);
          }
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
